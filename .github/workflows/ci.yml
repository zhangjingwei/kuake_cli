# Lint（静态分析）与 Test（单元测试）并行；与本地：golangci-lint run ./... + go test ./...
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test (Linux)
        if: runner.os != 'Windows'
        run: go test ./... -count=1 -timeout=15m

      # internal/guard currently has a known Windows failure on main. Keep the
      # Windows coverage for every other package until that baseline issue is
      # fixed separately.
      - name: go test (Windows, excluding known internal/guard baseline failure)
        if: runner.os == 'Windows'
        run: go test ./cmd/... ./sdk/... ./mcp/... -count=1 -timeout=15m
